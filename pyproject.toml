[project]
name = "invoicebot"
version = "1.0.0"
description = "A Selenium-based bot for automating downloading and printing bills from AziendaOnWeb, a SEAC service for electronic billing, integrated with the Sistema Di Interscambio of the italian Agenzia delle Entrate."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"selenium>=4.31.0",
	"python-dotenv>=1.0.1",
	"sqlalchemy>=2.0.49",
	"pytest>=9.0.3",
	"pycups>=2.0.4",
	"hikari>=2.5.0",
	"uvloop>=0.22.1",
	"babel>=2.18.0",
	"hikari-miru>=4.2.0",
	"pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_bot"]

[project.optional-dependencies]
dev = [
	"pytest>=8.3.5",
	"pytest-asyncio>=1.3.0",
	"pytest-cov>=6.0.0",
	"ruff>=0.15.13",
	"mkdocs>=1.6.1",
	"mkdocs-material>=9.7.6",
    "mkdocstrings-python>=2.0.3",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72

[tool.ruff.lint]
extend-select = [
	"UP",  # pyupgrade
	"D",   # pydocstyle
	"E",
	"F",
	"I",
]

ignore = [
    "D100",
    "D104",
    "D105",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"test/*" = ["D"]